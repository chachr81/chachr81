name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: chachr81
          template: classic
          base: ""
          config_timezone: America/Santiago
          plugin_calendar: yes
          plugin_calendar_limit: 0
          config_output: svg
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: chachr81
          template: classic
          base: ""
          config_timezone: America/Santiago
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8
          plugin_languages_categories: markup, programming, data, prose
          config_output: svg
          filename: github-languages.svg
          committer_branch: main
          committer_message: "chore: update languages [skip ci]"
