name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: chachr81
          template: classic
          base: activity, community, repositories
          config_timezone: America/Santiago
          config_output: svg
          filename: github-stats.svg
          committer_branch: main
          committer_message: "chore: update stats [skip ci]"

      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: chachr81
          template: classic
          base: ""
          config_timezone: America/Santiago
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_output: svg
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: update calendar [skip ci]"

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: chachr81
          template: classic
          base: ""
          config_timezone: America/Santiago
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 20
          config_output: svg
          filename: github-languages.svg
          committer_branch: main
          committer_message: "chore: update languages [skip ci]"